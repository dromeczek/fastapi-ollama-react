<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Chat (Ollama + FastAPI)</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body { font-family: system-ui, Arial; margin: 0; background:#0b0f19; color:#e8eefc; }
      .wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
      .card { background:#131a2a; border:1px solid #22304d; border-radius:16px; padding:16px; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
      .row { display:flex; gap:10px; }
      textarea { width:100%; min-height:70px; resize:vertical; border-radius:12px; border:1px solid #2a3b5f; background:#0f1524; color:#e8eefc; padding:12px; }
      button { border:0; border-radius:12px; padding:12px 16px; background:#3b82f6; color:white; font-weight:600; cursor:pointer; }
      button:disabled { opacity:.6; cursor:not-allowed; }
      .msg { padding:12px; border-radius:14px; margin:10px 0; border:1px solid #22304d; }
      .user { background:#0f1524; }
      .bot { background:#0f1f18; }
      .meta { font-size:12px; opacity:.75; margin-bottom:6px; }
      .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
      .pill { font-size:12px; padding:6px 10px; border-radius:999px; border:1px solid #22304d; background:#0f1524; }
      a { color:#93c5fd; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const API = "http://127.0.0.1:8000";

      function App() {
        const [prompt, setPrompt] = React.useState("");
        const [messages, setMessages] = React.useState([]);
        const [loading, setLoading] = React.useState(false);
        const [error, setError] = React.useState("");

        async function send() {
          const p = prompt.trim();
          if (!p || loading) return;

          setError("");
          setLoading(true);
          setPrompt("");

          const next = [...messages, { role: "user", text: p }];
          setMessages(next);

          try {
            const res = await fetch(`${API}/chat`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ prompt: p }),
            });

            if (!res.ok) {
              const t = await res.text();
              throw new Error(t || `HTTP ${res.status}`);
            }

            const data = await res.json();
            setMessages([...next, { role: "bot", text: data.answer ?? data.response ?? data }]);
          } catch (e) {
            setError(String(e.message || e));
            setMessages(next);
          } finally {
            setLoading(false);
          }
        }

        function onKeyDown(e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            send();
          }
        }

        return (
          <div className="wrap">
            <div className="top">
              <h2 style={{margin:0}}>Local Chat</h2>
              <div className="pill">FastAPI → Ollama (Llama3)</div>
            </div>

            <div className="card">
              <div>
                {messages.length === 0 && (
                  <div style={{opacity:.8, marginBottom: 10}}>
                    Napisz wiadomość. Enter wysyła, Shift+Enter robi nową linię.
                  </div>
                )}

                {messages.map((m, i) => (
                  <div key={i} className={`msg ${m.role === "user" ? "user" : "bot"}`}>
                    <div className="meta">{m.role === "user" ? "You" : "Model"}</div>
                    <div style={{whiteSpace:"pre-wrap"}}>{m.text}</div>
                  </div>
                ))}
              </div>

              {error && <div style={{color:"#fca5a5", margin:"8px 0"}}>Error: {error}</div>}

              <div className="row" style={{marginTop: 12}}>
                <textarea
                  value={prompt}
                  onChange={(e)=>setPrompt(e.target.value)}
                  onKeyDown={onKeyDown}
                  placeholder="Napisz wiadomość..."
                />
                <button onClick={send} disabled={loading || !prompt.trim()}>
                  {loading ? "..." : "Send"}
                </button>
              </div>

              <div style={{marginTop:10, fontSize:12, opacity:.75}}>
                API: <a href="http://127.0.0.1:8000/docs" target="_blank">Swagger</a>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
